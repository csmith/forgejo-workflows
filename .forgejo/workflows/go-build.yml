name: Build Go project

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      package:
        required: false
        type: string
        default: './...'
      env_vars:
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: docker 
    steps:
      - name: Checkout
        uses: https://git.yak-wall.ts.net/public/actions/checkout@master

      - name: Install Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: stable

      - name: Build
        run: |
          cd src;
          [ -n "${INPUTS_ENV_VARS}" ] && export ${INPUTS_ENV_VARS};
          go build "${INPUTS_PACKAGE}"
        env:
          INPUTS_PACKAGE: ${{inputs.package}}
          INPUTS_ENV_VARS: ${{inputs.env_vars}}
