name: Build and push container

permissions:
  contents: read
  packages: write

on:
  workflow_call:
    inputs:
      dockerfile:
        required: false
        type: string
        default: 'Dockerfile'
      image:
        required: false
        type: string
        default: ${{ github.repository }}

jobs:
  docker:
    runs-on: docker 
    container:
      image: quay.io/buildah/stable
    steps:
      - name: Checkout
        uses: http://forgejo.local:3000/public/actions/checkout@master

      - name: Do everything 
        run: |
          set -eux;
          sed -i 's/short-name-mode = "enforcing"/short-name-mode = "disabled"/g' /etc/containers/registries.conf;
          buildah login --tls-verify=false forgejo.local:3000 -u chris -p "${{ secrets.PACKAGE_REGISTRY_TOKEN }}";
          buildah bud -f "${{ inputs.dockerfile }}" --timestamp=0 --identity-label=false --label org.opencontainers.image.source="https://git.yak-wall.ts.net/$FORGEJO_REPOSITORY" -t "forgejo.local:3000/${{ inputs.image }}:latest";
          buildah push --tls-verify=false "forgejo.local:3000/${{ inputs.image }}:latest"
