name: Build and push container

permissions:
  contents: read
  packages: write

on:
  workflow_call:
    inputs:
      dockerfile:
        required: false
        type: string
        default: 'Dockerfile'
      image:
        required: false
        type: string
        default: ${{ github.repository }}

jobs:
  docker:
    runs-on: docker 
    container:
      image: quay.io/buildah/stable
    steps:
      - name: Checkout
        uses: https://git.yak-wall.ts.net/public/actions/checkout@master

      - name: Get tags
        uses: https://git.yak-wall.ts.net/public/actions/imagetags@master

      - name: Do everything
        run: |
          set -eux;
          [ -d src ] && cd src;
          sed -i 's/short-name-mode = "enforcing"/short-name-mode = "disabled"/g' /etc/containers/registries.conf;
          buildah login git.yak-wall.ts.net -u chris -p "${{ secrets.PACKAGE_REGISTRY_TOKEN }}";
          buildah bud -f "${{ inputs.dockerfile }}" --timestamp=0 --identity-label=false --label org.opencontainers.image.source="https://git.yak-wall.ts.net/$FORGEJO_REPOSITORY" -t "git.yak-wall.ts.net/${{ inputs.image }}:latest";
          buildah push "git.yak-wall.ts.net/${{ inputs.image }}:latest"
