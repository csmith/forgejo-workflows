name: Build and push container

permissions:
  contents: read
  packages: write

on:
  workflow_call:
    inputs:
      dockerfile:
        required: false
        type: string
        default: 'Dockerfile'
      image:
        required: false
        type: string
        default: ${{ github.repository }}

jobs:
  docker:
    runs-on: docker 
    container:
      image: quay.io/buildah/stable
    steps:
      - name: Do everything 
        run: |
          set -eux;
          mkdir -p "$FORGEJO_WORKSPACE";
          cd "$FORGEJO_WORKSPACE";
          export TOKEN=$(echo -n "x-access-token:${FORGEJO_TOKEN}" | base64);
          git -c "http.extraHeader=Authorization: basic $TOKEN" clone "${FORGEJO_SERVER_URL}/${FORGEJO_REPOSITORY}.git" .;
          git checkout "${FORGEJO_REF_NAME}";
          buildah login --tls-verify=false forgejo.local:3000 -u "${FORGEJO_REPOSITORY_OWNER}" -p "${FORGEJO_TOKEN}";
          buildah bud -f "${{ inputs.dockerfile }}" --timestamp=0 --identity-label=false -t "forgejo.local:3000/${{ inputs.image }}:latest";
          buildah push --tls-verify=false "forgejo.local:3000/${{ inputs.image }}:latest"
