name: Check that a container builds

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      dockerfile:
        required: false
        type: string
        default: 'Dockerfile'

jobs:
  docker:
    runs-on: docker 
    container:
      image: quay.io/buildah/stable
    steps:
      - name: Do everything 
        run: |
          set -eux;
          mkdir -p "$FORGEJO_WORKSPACE";
          cd "$FORGEJO_WORKSPACE";
          export TOKEN=$(echo -n "x-access-token:${FORGEJO_TOKEN}" | base64);
          git -c "http.extraHeader=Authorization: basic $TOKEN" clone "${FORGEJO_SERVER_URL}/${FORGEJO_REPOSITORY}.git" .;
          git checkout "${FORGEJO_SHA}";
          sed -i 's/short-name-mode = "enforcing"/short-name-mode = "disabled"/g' /etc/containers/registries.conf;
          buildah bud -f "${{ inputs.dockerfile }}" --timestamp=0 --identity-label=false
